outcome:
  label: "sepsis"
  prediction_window_hours: 1    # 6 se 1 kiya → online model jaldi seekhega
  sofa_threshold: 2

alerting:
  risk_threshold: 0.65
  alert_cooldown_minutes: 30

features:
  window_sizes_minutes: [60, 240, 480]
  staleness_threshold_minutes: 120

  vital_features:
    - HR
    - O2Sat
    - Temp
    - SBP
    - MAP
    - DBP
    - Resp
    - EtCO2

  lab_features:
    - BaseExcess
    - HCO3
    - FiO2
    - pH
    - PaCO2
    - SaO2
    - AST
    - BUN
    - Alkalinephos
    - Calcium
    - Chloride
    - Creatinine
    - Bilirubin_direct
    - Glucose
    - Lactate
    - Magnesium
    - Phosphate
    - Potassium
    - Bilirubin_total
    - TroponinI
    - Hct
    - Hgb
    - PTT
    - WBC
    - Fibrinogen
    - Platelets

  demographic_features:
    - Age
    - Gender
    - Unit1
    - Unit2
    - HospAdmTime
    - ICULOS

streaming:
  speed_multiplier: 60
  batch_size: 10
  kafka_enabled: false
  kafka_bootstrap_servers: "localhost:9092"
  kafka_topic: "patient_vitals"

online_model:
  type: "hoeffding_adaptive_tree"
  learning_rate: 0.01
  snapshot_every_n_predictions: 100
  shadow_mode: false

baseline:
  model_path: "models/baseline_model.pkl"
  rollback_auroc_gap: 0.05

ensemble:
  strategy: "weighted_blend"   # online + baseline dono use hote hain
  blend_online_weight: 0.6
  blend_baseline_weight: 0.4

drift:
  adwin_delta: 0.002
  page_hinkley_threshold: 50.0
  page_hinkley_alpha: 0.005
  ddm_warning_level: 2.0
  ddm_drift_level: 3.0
  check_every_n: 50

paths:
  data_dir: "data/training_setA"
  training_dir: "data/training_setA/training"
  model_snapshots: "models/snapshots"
  audit_db: "logs/audit.db"
  baseline_model: "models/baseline_model.pkl"
  baseline_meta: "models/baseline_meta.json"
  feature_importance: "models/feature_importance.json"

dashboard:
  refresh_interval_seconds: 5
  max_alerts_shown: 50
  high_risk_color: "#FF4B4B"
  medium_risk_color: "#FFA500"
  low_risk_color: "#00CC44"

# LLM / chatbot — leave placeholders until a real provider is wired
ai:
  enabled: true
  provider: "openai_compatible"   # openai | azure_openai | anthropic | openai_compatible
  api_key: "YOUR_LLM_API_KEY_HERE"
  api_key_env: "SEPSISGUARD_LLM_API_KEY"
  base_url: "https://YOUR_LLM_BASE_URL_HERE/v1"
  base_url_env: "SEPSISGUARD_LLM_BASE_URL"
  model: "YOUR_LLM_MODEL_HERE"
  model_env: "SEPSISGUARD_LLM_MODEL"
  chat_completions_path: "/chat/completions"
  timeout_seconds: 30
  max_tokens: 800
  temperature: 0.2
  openai:
    api_key: "YOUR_OPENAI_API_KEY_HERE"
    base_url: "https://api.openai.com/v1"
    model: "YOUR_OPENAI_MODEL_HERE"
  azure_openai:
    api_key: "YOUR_AZURE_OPENAI_API_KEY_HERE"
    endpoint: "https://YOUR_AZURE_RESOURCE_NAME.openai.azure.com"
    deployment: "YOUR_AZURE_DEPLOYMENT_NAME"
    api_version: "YOUR_AZURE_API_VERSION_HERE"
  anthropic:
    api_key: "YOUR_ANTHROPIC_API_KEY_HERE"
    base_url: "https://api.anthropic.com"
    model: "YOUR_ANTHROPIC_MODEL_HERE"
  gemini:
    api_key: "YOUR_GEMINI_API_KEY_HERE"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model: "gemini-1.5-flash"
  ollama:
    base_url: "http://localhost:11434/v1"
    model: "llama3"

# Model card metadata — populated by train_baseline.py
model_card:
  name: "PhysioNet CinC 2019 Sepsis EWS"
  version: "1.0"
  description: "Predicts sepsis onset within 4-6 hours from streaming ICU vitals and labs."
  dataset: "PhysioNet/CinC Challenge 2019"
  intended_use: "Research and education only. Not validated for clinical use."
  limitations:
    - "No GCS / mental-status input"
    - "Demographic features not de-biased"
    - "Delayed labels (6h window)"
  clinical_scores: ["NEWS2", "qSOFA", "SIRS", "SOFA (partial)"]
