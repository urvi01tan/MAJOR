outcome:
  label: "sepsis"
  prediction_window_hours: 6
  sofa_threshold: 2

alerting:
  risk_threshold: 0.65
  alert_cooldown_minutes: 30

features:
  window_sizes_minutes: [60, 240, 480]
  staleness_threshold_minutes: 120

  vital_features:
    - HR
    - O2Sat
    - Temp
    - SBP
    - MAP
    - DBP
    - Resp
    - EtCO2

  lab_features:
    - BaseExcess
    - HCO3
    - FiO2
    - pH
    - PaCO2
    - SaO2
    - AST
    - BUN
    - Alkalinephos
    - Calcium
    - Chloride
    - Creatinine
    - Bilirubin_direct
    - Glucose
    - Lactate
    - Magnesium
    - Phosphate
    - Potassium
    - Bilirubin_total
    - TroponinI
    - Hct
    - Hgb
    - PTT
    - WBC
    - Fibrinogen
    - Platelets

  demographic_features:
    - Age
    - Gender
    - Unit1
    - Unit2
    - HospAdmTime
    - ICULOS

streaming:
  speed_multiplier: 60
  batch_size: 10
  kafka_enabled: false
  kafka_bootstrap_servers: "localhost:9092"
  kafka_topic: "patient_vitals"

online_model:
  type: "hoeffding_adaptive_tree"
  learning_rate: 0.01
  snapshot_every_n_predictions: 100
  shadow_mode: false

baseline:
  model_path: "models/baseline_model.pkl"
  rollback_auroc_gap: 0.05

# Ensemble strategy controls how online + baseline scores are combined
# Options: auto_rollback | online_only | baseline_only | weighted_blend
ensemble:
  strategy: "auto_rollback"
  blend_online_weight: 0.6
  blend_baseline_weight: 0.4

drift:
  adwin_delta: 0.002
  page_hinkley_threshold: 50.0
  page_hinkley_alpha: 0.005
  ddm_warning_level: 2.0
  ddm_drift_level: 3.0
  check_every_n: 50

paths:
  data_dir: "data/training_setA"
  training_dir: "data/training_setA/training"
  model_snapshots: "models/snapshots"
  audit_db: "logs/audit.db"
  baseline_model: "models/baseline_model.pkl"
  baseline_meta: "models/baseline_meta.json"
  feature_importance: "models/feature_importance.json"

dashboard:
  refresh_interval_seconds: 5
  max_alerts_shown: 50
  high_risk_color: "#FF4B4B"
  medium_risk_color: "#FFA500"
  low_risk_color: "#00CC44"

# Model card metadata — populated by train_baseline.py
model_card:
  name: "PhysioNet CinC 2019 Sepsis EWS"
  version: "1.0"
  description: "Predicts sepsis onset within 4-6 hours from streaming ICU vitals and labs."
  dataset: "PhysioNet/CinC Challenge 2019"
  intended_use: "Research and education only. Not validated for clinical use."
  limitations:
    - "No GCS / mental-status input"
    - "Demographic features not de-biased"
    - "Delayed labels (6h window)"
  clinical_scores: ["NEWS2", "qSOFA", "SIRS", "SOFA (partial)"]
